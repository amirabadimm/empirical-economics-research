[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-cross-asset-allocation"
version = "0.1.0"
description = "Reproducible monthly asset-allocation research for Iranian markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "ipykernel>=6,<8",
    "jdatetime>=5,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "requests>=2.32,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
