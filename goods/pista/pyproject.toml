[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pista-ime-certificate"
version = "0.1.0"
description = "Reproducible collection of IME pistachio certificate trades"
requires-python = ">=3.11"
dependencies = [
    "jdatetime>=5,<7",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
