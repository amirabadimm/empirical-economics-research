[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-usd"
version = "0.1.0"
description = "Independent preparation of macroeconomic inputs for future USD/IRR research"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

