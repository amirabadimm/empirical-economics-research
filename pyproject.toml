[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-economics-research"
version = "0.1.0"
description = "Reproducible empirical research on commodity, energy, and financial markets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mohammad Mahdi Amirabadi" }]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4",
  "jdatetime",
  "numpy",
  "pandas",
  "persiantools",
  "requests",
  "scikit-learn",
  "truststore",
  "xlrd",
  "pypdf",
]

[project.optional-dependencies]
notebooks = [
  "ipython",
  "jupyterlab",
  "matplotlib",
  "nbformat",
  "plotly",
  "scipy",
  "seaborn",
  "statsmodels",
]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Finenv", "temporary"]

[tool.ruff.lint]
# Enforce correctness-critical checks in CI; broader style cleanup is tracked separately.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools]
# This repository is a multi-project research workspace, not one importable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["commodity", "codal", "energy_exchange", "shared"]
pythonpath = ["."]
addopts = "-ra"
