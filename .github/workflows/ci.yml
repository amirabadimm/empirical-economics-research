name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install root research workspace
        run: python -m pip install -e ".[dev,notebooks]"

      - name: Ruff
        run: python -m ruff check .

      - name: Root test suite
        run: python -m pytest -q

      - name: Pistachio project tests
        run: python -m pytest -q goods/pista/tests

      - name: Install asset-allocation project
        run: python -m pip install -e "./asset_allocation[test]"

      - name: Asset-allocation collector tests
        run: >-
          python -m pytest -q
          asset_allocation/tests/test_tgju_gold_18k.py
          asset_allocation/tests/test_tsetmc_fixed_income.py
